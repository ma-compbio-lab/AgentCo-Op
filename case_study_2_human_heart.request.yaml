# Case Study 2 (human heart) request — Seurat × Signac collaboration on
# the GSE270788 paired single-nucleus 10x Multiome ATAC + Gene Expression
# dataset, sample MA7. Spec: docs/experiments/case_study_2_human_heart.md.
#
# Loaded by: python -m agentcoop.cli collaborate
#                   --request case_study_2_human_heart.request.yaml
#                   --workdir runs/case2/human_heart_ma7_docker
#                   --docker
#
# This file mirrors case_study_2.request.yaml (mouse skin) — the only
# meaningful changes are: dataset (mouse skin SHARE-seq → human heart
# 10x H5), genome (mm10 → hg38), default ATAC method (peak_to_gene →
# gene_activity, per spec §11), CellMarker tissue filter (Skin → Heart),
# and aliases (mouse skin → human heart cell types).

case_id: gse270788_human_heart_ma7_seurat_signac_collaboration
mode: autonomous_tool_wrapping
topology: parallel_then_join
model: gpt-5
reasoning_effort: medium

repositories:
  - name: Seurat
    url: https://github.com/satijalab/seurat
    role_hint: scRNA-seq marker discovery specialist (Seurat::FindAllMarkers)
    docs:
      - https://satijalab.org/seurat/articles/pbmc3k_tutorial
      - https://satijalab.org/seurat/reference/findmarkers
    sandbox_overrides:
      runtime_image: agentcoop-r-runtime:case-study
  - name: Signac
    url: https://github.com/stuart-lab/signac
    role_hint: snATAC-seq marker-gene discovery specialist (Signac::GeneActivity → Seurat::FindAllMarkers)
    docs:
      - https://stuartlab.org/signac/articles/pbmc_multiomic
      - https://stuartlab.org/signac/articles/pbmc_vignette
      - https://stuartlab.org/signac/reference/geneactivity
    sandbox_overrides:
      runtime_image: agentcoop-r-runtime:case-study

join_agent:
  name: CellMarkerEvaluator
  role_hint: CellMarker 2.0 + PanglaoDB human heart marker evaluation specialist
  inputs:
    cellmarker_file: data/heart_human/Cell_marker_All.xlsx
    panglaodb_file: data/panglaodb/PanglaoDB_markers_27_Mar_2020.tsv
    organism: Human
    tissue_filter_primary: [Heart]
    tissue_filter_extended:
      - Heart
      - Cardiac
      - Myocardium
      - Atrium
      - Ventricle
      - Left atrium
      - Right atrium
      - Left ventricle
      - Right ventricle
    # Aliases default to the heart-specific table built into the
    # adapter when organism="Human"; we override here only to surface
    # the canonical mapping in the request itself.
    aliases:
      Cardiomyocyte: [cardiomyocyte, cardiac muscle cell, ventricular cardiomyocyte, atrial cardiomyocyte]
      vCM:           [ventricular cardiomyocyte, cardiomyocyte]
      aCM:           [atrial cardiomyocyte, cardiomyocyte]
      Fibroblast:    [fibroblast, cardiac fibroblast, myofibroblast]
      Cardiac Fibroblast: [cardiac fibroblast, fibroblast]
      Myofibroblast: [myofibroblast, fibroblast]
      Endothelial:   [endothelial cell, vascular endothelial cell]
      EC:            [endothelial cell]
      Lymphatic Endothelial: [lymphatic endothelial cell, endothelial cell]
      Smooth Muscle Cell: [smooth muscle cell, vascular smooth muscle cell]
      SMC:           [smooth muscle cell]
      Pericyte:      [pericyte, mural cell, smooth muscle cell]
      Mural Cell:    [pericyte, mural cell]
      Macrophage:    [macrophage, monocyte]
      Mac:           [macrophage]
      Mono/Mac:      [macrophage, monocyte]
      Monocyte:      [monocyte, macrophage]
      Dendritic Cell: [dendritic cell]
      T cell:        [t cell, t lymphocyte]
      B cell:        [b cell, b lymphocyte]
      NK cell:       [natural killer cell, nk cell]
      Adipocyte:     [adipocyte, fat cell]
      Neuron:        [neuron, neural cell]
      Schwann Cell:  [schwann cell]
      Glial Cell:    [glial cell]
      Mesothelial:   [mesothelial cell]
      Epicardial:    [epicardial cell]

dataset:
  name: gse270788_human_heart_ma7_paired_multiome
  organism: Homo sapiens
  genome: hg38
  tissue: heart
  geo_series: GSE270788
  default_sample_id: MA7
  default_sample_condition: ICM
  paired_cells: true
  assay_platform: 10x Chromium Next GEM Single Cell Multiome ATAC + Gene Expression
  format: tenx_h5_multiome   # selects the new wrapper code path
  local_cache_dir: data/heart_human
  files:
    # Single H5 holds both Gene Expression and Peaks assays. The Seurat
    # wrapper reads `Gene Expression`; the Signac wrapper reads `Peaks`.
    tenx_h5: MA7/GSM8352050_MA7_filtered_feature_bc_matrix.h5
    # Sorted, bgzipped, tabix-indexed by scripts/cs2_human_heart_setup.sh.
    atac_fragments: MA7/GSM8352073_MA7_atac_fragments.sorted.tsv.bgz
    metadata: GSE270788_metadata.csv.gz
    cellmarker: Cell_marker_All.xlsx
  gex_sample:
    accession: GSM8352050
    title: GEX MA7
    direct_download: https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSM8352050&file=GSM8352050_MA7_filtered_feature_bc_matrix.h5&format=file
  atac_sample:
    accession: GSM8352073
    title: ATAC MA7
    direct_download: https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSM8352073&file=GSM8352073_MA7_atac_fragments.tsv.gz&format=file
  metadata_source:
    direct_download: https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSE270788&file=GSE270788_metadata.csv.gz&format=file
  backup_sample:
    sample_id: MA5
    condition: Donor
    gex_accession: GSM8352048
    atac_accession: GSM8352071

task:
  title: GSE270788 human heart paired single-nucleus multiome cross-modal marker collaboration
  description: >
    Identify cell-type marker genes for the GSE270788 MA7 human heart
    paired single-nucleus 10x Multiome dataset from two molecular
    modalities. Use Seurat::FindAllMarkers on the gene-expression assay
    of the 10x H5 to compute the top-N RNA markers per cell type.
    Use Signac::GeneActivity on the Peaks assay + ATAC fragments to
    derive a gene-activity matrix, then Seurat::FindAllMarkers with
    matching DE parameters to compute the top-N ATAC marker genes per
    cell type. For every cell type, compute the intersection and union
    of the RNA and ATAC marker sets. Evaluate each set independently
    against CellMarker 2.0 (human heart) and PanglaoDB (Hs heart),
    reporting per-cell-type and macro precision (RNA, ATAC, intersection)
    and recall (RNA, ATAC, union). Report whether the hypothesis
    `precision_intersection > precision_rna > precision_atac` and
    `recall_union > recall_rna > recall_atac` holds for each database;
    do not tune parameters to force the ordering.
  organism: Homo sapiens

parameters:
  top_n: 50
  min_cells_per_type: 20
  remove_cell_types: [Mix, Mixed, Unknown]
  rna_marker_method:
    test_use: wilcoxon
    only_pos: true
    min_pct: 0.10
    logfc_threshold: 0.25
  atac_marker_method:
    test_use: wilcoxon
    only_pos: true
    min_pct: 0.10
    # Spec §4.2 declares Signac::GeneActivity as the primary ATAC
    # method for the human heart variant. The wrapper also defaults
    # to gene_activity when dataset.format=tenx_h5_multiome, so this
    # is just being explicit.
    signac_method: gene_activity
    extend_upstream_bp: 2000
    allow_peak_to_gene_fallback: true
    # Signac::GeneActivity on a single 10x multiome sample (~5 k cells)
    # is well-bounded; no per-cell subsample needed.
    peak_marker_max_cells: 0

required_outputs:
  - compiled_workflow_graph.json
  - agent_registry.json
  - manifests/docker_build_report.json
  - manifests/repo_profile_Seurat.json
  - manifests/repo_profile_Signac.json
  - manifests/env_manifest.json
  - artifacts/seurat_run/seurat_rna_markers_all.csv
  - artifacts/seurat_run/rna_top_markers_by_celltype.json
  - artifacts/seurat_run/celltype_distribution.csv
  - artifacts/signac_run/signac_gene_activity_markers_all.csv
  - artifacts/signac_run/atac_top_marker_genes_by_celltype.json
  - artifacts/cellmarkerevaluator_run/marker_set_operations_by_celltype.json
  - artifacts/cellmarkerevaluator_run/marker_set_sizes_by_celltype.csv
  - artifacts/cellmarkerevaluator_run/cellmarker_gold_markers_by_celltype.json
  - artifacts/cellmarkerevaluator_run/cellmarker_label_mapping.csv
  - artifacts/cellmarkerevaluator_run/precision_recall_by_celltype.csv
  - artifacts/cellmarkerevaluator_run/precision_recall_summary.csv
  - artifacts/cellmarkerevaluator_run/collaboration_gain_table.csv
  - artifacts/cellmarkerevaluator_run/marker_overlap_heatmap.png
  - artifacts/cellmarkerevaluator_run/precision_recall_barplot.png
  - artifacts/cellmarkerevaluator_run/panglaodb_gold_markers_by_celltype.json
  - artifacts/cellmarkerevaluator_run/precision_recall_panglaodb_by_celltype.csv
  - artifacts/cellmarkerevaluator_run/precision_recall_panglaodb_summary.csv
  - run_manifest.json
  - collaboration_log.md
  - final_report.md
  - topology.png
  - topology.dot
  - traces/execution_trace.jsonl

success_criteria:
  docker_sandboxes_built: true
  seurat_node_called: true
  signac_node_called: true
  cellmarker_evaluation_completed: true
  panglaodb_evaluation_completed: true
  top_marker_sets_created_for_minimum_cell_types: 5
  required_collaboration: true
  max_replans: 2

name: geneformer
backend_type: sandbox_repo
source:
  repo: https://huggingface.co/ctheodoris/Geneformer
  commit: TODO_PIN
build:
  dockerfile: Dockerfile.agentcoop
  context: .
run:
  entrypoint: python /workspace/adapter.py
  args_schema:
    command: str
    params:
      dataset: str
      task: str
      output: str
resources:
  cpus: 8
  memory_gb: 32
  gpu: true
  min_vram_gb: 24
  pids_limit: 1024
  timeout_s: 7200
security:
  network: none
  non_root: true
  mounts: [{input: read_only}, {output: read_write}]
  secrets: []
outputs:
  result_json: /outputs/result.json
  logs: /outputs/logs.txt
notes:
  - "Optional Case Study 2 specialist. Used for cell embeddings / classification, not direct perturbation."

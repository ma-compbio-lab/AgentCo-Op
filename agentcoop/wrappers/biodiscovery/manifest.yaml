name: biodiscovery_agent
backend_type: sandbox_repo
source:
  repo: https://github.com/snap-stanford/BioDiscoveryAgent
  commit: PINNED_COMMIT_SHA
build:
  dockerfile: Dockerfile.agentcoop
  context: .
run:
  entrypoint: python /workspace/adapter.py
  args_schema:
    command: str
    params:
      dataset: str
      num_steps: int
      num_genes: int
      flags: dict
resources:
  cpus: 4
  memory_gb: 16
  gpu: false
  pids_limit: 512
  timeout_s: 7200
security:
  network: allowlist
  non_root: true
  mounts:
    - input: read_only
    - output: read_write
  secrets:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
outputs:
  result_json: /outputs/result.json
  logs: /outputs/logs.txt
notes:
  - "Adapter is framework-only; real repo call requires pinned commit + Docker build."

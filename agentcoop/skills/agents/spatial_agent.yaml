name: spatial_agent
kind: agent_skill
backend_type: sandbox_repo
capabilities:
  - spatial_transcriptomics_qc
  - cell_typing
  - differential_expression
  - spatial_analysis
  - hypothesis_generation
source:
  repo: https://github.com/Genentech/SpatialAgent
  commit: PINNED_COMMIT_SHA
requirements:
  docker_image: agentcoop/spatialagent
  cpus: 8
  memory_gb: 32
  gpu: optional
  network: allowlist
  secrets:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
input_contract:
  command: str
  params:
    dataset_dir: str
    question: str
    output_dir: str
output_contract:
  ok: bool
  answer: str
  gene_sets: dict
  artifacts: list
  logs_summary: str
risk:
  code_execution: true
  data_exfiltration: medium
cost_class: high
risk_level: medium
applicable_tags: [bio, spatial, transcriptomics, repo]

extends: _base
suite: specialized_cross
dataset: cross_specialist_pilot
description: >
  Exploratory cross-specialist pilot: SpatialAgent extracts spatial gene programs,
  BioDiscoveryAgent uses them as prior for perturbation design.

status: exploratory
labels:
  - not_a_main_benchmark
  - demo_only

workflow:
  - SpatialTaskPlanner
  - SpatialAgentSandbox
  - SpatialProgramExtractor
  - PerturbationTaskRewriter
  - BioDiscoveryAgentSandbox
  - CrossModalIntegrator
  - EvidenceAndCausalityReviewer

budget:
  max_tokens: 80000
  max_cost_usd: 5.0
  max_wall_time_s: 14400
  max_iterations: 4

ground_truth_options:
  - matched_perturbation_screen
  - retrospective_known_targets
  - gene_set_enrichment     # appendix only
  - expert_review           # appendix only
  - no_gt_demo              # demo only

variants:
  Spatial-only:
    description: "SpatialAgent markers as ranked perturbations"
  Bio-only:
    description: "BioDiscoveryAgent without spatial context"
  UnionIntersection:
    description: "Manual merge heuristic"
  AC-Collab:
    description: "AgentCo-Op compiled collaboration (main)"
  AC-Collab-NoIntegrator:
    description: "Remove cross-modal integrator"
  AC-Collab-NoReviewer:
    description: "Remove evidence reviewer"

repos:
  spatial:
    manifest: agentcoop/wrappers/spatialagent/manifest.yaml
    external: external/SpatialAgent
  bio:
    manifest: agentcoop/wrappers/biodiscovery/manifest.yaml
    external: external/BioDiscoveryAgent

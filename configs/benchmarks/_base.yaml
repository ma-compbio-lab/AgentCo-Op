# Shared benchmark defaults. Per-dataset configs inherit these via
# `extends: _base` at load time. Variant names match experiments.md §3.

run:
  seed: 42
  repeats: 1
  output_root: runs
  persist_predictions: true
  concurrency: 8

model:
  # Override per config. `mock-llm` keeps dry-runs offline; real runs
  # require OPENAI_API_KEY / ANTHROPIC_API_KEY.
  provider: mock
  name: mock-llm
  temperature: 0.0
  max_tokens: 4096

variants:
  AC-Direct:
    force_topology_level: 0
    description: "Direct / single-agent execution only — simplicity-first floor"
  AC-Compiled:
    force_topology_level: null
    disable_gates: true
    description: "Compile a base workflow; disable runtime gated repair"
  AC-Gated:
    force_topology_level: null
    disable_gates: false
    description: "Main method — compiled graph + gated local refinement"
  AC-ForcedMulti:
    force_topology_level: 4
    description: "Force multi-specialist execution to surface negative returns"
  AC-NoMetaSkills:
    force_topology_level: null
    disable_gates: false
    retrieval_bias: coarse_rules
    description: "Disable meta-skill evidence; fall back to shallow routing rules"
  AC-NoToolSkills:
    force_topology_level: null
    disable_python_sandbox: true
    disable_repo_backend: true
    description: "Disable tool / sandbox / repo backends; force LLM-only execution"
  AC-NoReviewer:
    force_topology_level: null
    disable_reviewer: true
    description: "Remove reviewer / verifier nodes and gates"
  AC-AFlowImported:
    source_graph: aflow_imported
    disable_gates: true
    description: "Execute AFlow-imported topology without AgentCo-Op skill/tool augmentation"
  AC-AFlowImported-Gated:
    source_graph: aflow_imported
    augment_skills: true
    augment_tools: true
    disable_gates: false
    description: "AFlow topology + AgentCo-Op skills + gated local repair (Case Study 3 main)"

  # ----- Session 8 ablation variants (per `docs/experiments/ablation.md` §1) ---------------
  # 2 × 2 factorial: skills+tools (on/off) × gate_repair (on/off).
  # Implemented purely via the wired `_apply_variant` knobs
  # (`disable_gates`, `disable_reviewer`) — NO core-code edits.
  # `AC-NoSkillsTools` is a *proxy* ablation: it removes reviewer /
  # verifier specialist nodes (which ARE the principal skill-driven
  # post-generation specialists for math/code/QA workflows) but
  # cannot drop tool / sandbox nodes without core-code changes. The
  # ablation report (`runs/ablations/README.md`) documents this
  # honestly.
  AC-Full:
    description: "Ablation AC-Full — skills+tools on, gate_repair on (alias for AC-Gated)"
  AC-NoGate:
    disable_gates: true
    description: "Ablation AC-NoGate — skills+tools on, gate_repair off"
  AC-NoSkillsTools:
    disable_reviewer: true
    description: "Ablation AC-NoSkillsTools — skills+tools off (proxy: drop reviewer/verifier specialist nodes), gate_repair on"
  AC-Minimal:
    disable_gates: true
    disable_reviewer: true
    description: "Ablation AC-Minimal — both skills+tools and gate_repair off"

budget:
  max_tokens: 20000
  max_cost_usd: 1.0
  max_wall_time_s: 600
  max_iterations: 3

safety:
  sandbox_network: none
  require_approval_for:
    - network_enable
    - unknown_shell_command
    - package_install_from_url

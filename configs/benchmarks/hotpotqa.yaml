extends: _base
dataset: hotpotqa
split: test
aflow_aligned: true
grader: hotpotqa

budget:
  max_tokens: 32000
  max_cost_usd: 0.30
  max_wall_time_s: 600
  max_iterations: 5

budget_by_dataset:
  max_llm_calls: 6
  max_tool_calls: 5
  max_cost_usd: 0.30

model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 2048

variants:
  AC-Direct: {force_topology_level: 1}
  AC-Compiled: {disable_gates: true}
  AC-Gated: {disable_gates: false}
  AC-ForcedMulti: {force_topology_level: 4}
  AC-NoReviewer: {disable_reviewer: true}
  AC-NoMetaSkills: {retrieval_bias: coarse_rules}

gates:
  evidence_missing: {action: add_retrieval, max_activations: 2}
  answer_unsupported: {action: retry_node, max_activations: 1}
  answer_format_invalid: {action: add_formatter, max_activations: 1}
  high_disagreement: {action: add_specialist, max_activations: 1}

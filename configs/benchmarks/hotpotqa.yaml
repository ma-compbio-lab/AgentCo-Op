extends: _base
dataset: hotpotqa
split: test
aflow_aligned: true
grader: hotpotqa

budget:
  max_tokens: 20000
  max_cost_usd: 0.40
  max_wall_time_s: 600
  max_iterations: 5

model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 2048

variants:
  AC-Direct:
    force_topology_level: 1
  AC-Compiled:
    force_topology_level: null
    disable_gates: true
  AC-Gated:
    force_topology_level: null
    disable_gates: false
  AC-NoReviewer:
    force_topology_level: null
    disable_reviewer: true
  AC-ForcedMulti:
    force_topology_level: 4

budget_by_dataset:
  max_retrieval_calls: 5

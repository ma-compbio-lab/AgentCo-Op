extends: _base
suite: specialized_bio
dataset: biodiscovery
grader: biodiscovery_hit_rate

datasets:
  - IFNG
  - IL2
  - Carnevale22_Adenosine
  - Scharenberg22
  - Sanchez21_down

budget:
  max_tokens: 40000
  max_cost_usd: 2.0
  max_wall_time_s: 7200
  max_iterations: 5

model:
  provider: anthropic
  name: claude-3-5-sonnet-20240620
  temperature: 0.0
  max_tokens: 4096

params:
  num_steps: 5
  num_genes: 128
  flags:
    lit_review: true
    critique: true
    reactome: true

variants:
  Random:
    source: paper_baseline
    description: "Random gene selection baseline from the paper"
  BO:
    source: paper_baseline
    description: "Bayesian-optimization baseline from the paper"
  BioDiscoveryAgent-base:
    description: "Official command, no AgentCo-Op planner"
  BioDiscoveryAgent-allTools:
    flags:
      lit_review: true
      critique: true
      reactome: true
  AC-BioBudgeted:
    description: "AgentCo-Op selects tools based on budget and dataset profile"
  AC-BioGated:
    disable_gates: false
  AC-BioNoCritique:
    flags:
      critique: false

repo:
  manifest: agentcoop/wrappers/biodiscovery/manifest.yaml
  external: external/BioDiscoveryAgent
  commit_source: configs/external_commits.yaml

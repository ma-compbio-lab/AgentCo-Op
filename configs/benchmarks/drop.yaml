extends: _base
dataset: drop
split: test
aflow_aligned: true
grader: drop

budget:
  max_tokens: 16000
  max_cost_usd: 0.25
  max_wall_time_s: 600
  max_iterations: 5

budget_by_dataset:
  max_llm_calls: 5
  max_cost_usd: 0.25

model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024

variants:
  AC-Direct: {force_topology_level: 1}
  AC-Compiled: {disable_gates: true}
  AC-Gated: {disable_gates: false}
  AC-ForcedMulti: {force_topology_level: 4}
  AC-NoReviewer: {disable_reviewer: true}

gates:
  numeric_inconsistency: {action: retry_node, max_activations: 1}
  answer_type_mismatch: {action: add_formatter, max_activations: 1}
  multi_span_conflict: {action: add_specialist, max_activations: 1}

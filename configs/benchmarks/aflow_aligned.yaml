# Top-level AFlow-aligned sweep. Points to per-dataset configs.
# Usage:
#   agentcoop run-benchmark --config configs/benchmarks/aflow_aligned.yaml \
#     --limit 10 --dry-run

suite: aflow_aligned
version: "0.2"
seed: 42

datasets:
  - gsm8k
  - math
  - humaneval
  - mbpp
  - hotpotqa
  - drop

variants:
  - AC-Direct
  - AC-Compiled
  - AC-Gated
  - AC-ForcedMulti
  - AC-NoMetaSkills
  - AC-NoToolSkills
  - AC-NoReviewer

per_dataset_config_dir: configs/benchmarks
repeats: 3
report:
  main_table: runs/aflow_aligned/main_table.csv
  cost_table: runs/aflow_aligned/cost_table.csv
  route_distribution: runs/aflow_aligned/route_distribution.csv
  gate_analysis: runs/aflow_aligned/gate_analysis.csv

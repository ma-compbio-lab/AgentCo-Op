extends: _base
suite: specialized_spatial
dataset: spatialbench
grader: spatialbench_deterministic

tiers:
  S2-small:
    source: external/SpatialAgent/resource
    description: "Public canonical examples shipped with the SpatialAgent repo"
  S2-full:
    source: private
    description: "Full 146-task SpatialBench (gated; not publicly accessible as of 2026-04-22)"

budget:
  max_tokens: 60000
  max_cost_usd: 3.0
  max_wall_time_s: 10800
  max_iterations: 6

model:
  provider: openai
  name: gpt-4o
  temperature: 0.0
  max_tokens: 4096

variants:
  DirectLLM:
    description: "Answer from the task only, no SpatialAgent call"
  MiniSWE:
    description: "Generic coding agent"
  SpatialAgent-alone:
    description: "Run SpatialAgent directly per official README"
  AC-Spatial:
    description: "AgentCo-Op planner → SpatialAgent sandbox → artifact reviewer"
  AC-Spatial-Gated:
    disable_gates: false
    description: "+ failure gates: missing artifact, grader fail, runtime error"
  AC-ForcedMulti:
    force_topology_level: 4

repo:
  manifest: agentcoop/wrappers/spatialagent/manifest.yaml
  external: external/SpatialAgent
  commit_source: configs/external_commits.yaml

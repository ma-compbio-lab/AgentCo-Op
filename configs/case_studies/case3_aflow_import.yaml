# Case Study 3 — AFlow workflow import + dynamic gated refinement
# See docs/experiments/case_study.md §4.

case_study: case3_aflow_dynamic
description: >
  Import AFlow-discovered or reconstructed topologies on code/math
  benchmarks, attach AgentCo-Op skills and tools, and compare static
  execution vs gated local repair.

benchmarks:
  humaneval:
    imported_graph_source: external/AFlow/workspace/HumanEval
    # When a specific workflow is pinned, use:
    #   workflow_file: external/AFlow/workspace/HumanEval/workflows/round_1/graph.py
    gates_file: configs/gates/code_runtime_gates.yaml
    skills_files:
      - configs/skills/code_debugging.yaml
      - configs/skills/python_testing.yaml
    tools:
      - sandbox_python
      - generated_tests
      - static_analyzer
    benchmark_config: configs/benchmarks/humaneval.yaml
  mbpp:
    imported_graph_source: external/AFlow/workspace/MBPP
    gates_file: configs/gates/code_runtime_gates.yaml
    skills_files:
      - configs/skills/code_debugging.yaml
      - configs/skills/python_testing.yaml
    tools:
      - sandbox_python
      - generated_tests
    benchmark_config: configs/benchmarks/mbpp.yaml
  math:
    imported_graph_source: external/AFlow/workspace/MATH
    gates_file: configs/gates/math_gates.yaml
    skills_files:
      - configs/skills/math_skills.yaml
    tools:
      - sympy_checker
      - numeric_checker
    benchmark_config: configs/benchmarks/math.yaml

variants:
  AFlow-original:
    description: "Original AFlow workflow + runtime (reference baseline)"
  AFlow-imported:
    source_graph: aflow_imported
    disable_gates: true
    description: "AFlow topology in AgentCo-Op runtime (no skill/tool augmentation)"
  AC-AFlow+Skills:
    source_graph: aflow_imported
    augment_skills: true
    augment_tools: true
    disable_gates: true
    description: "Imported topology + skills/tools, no gates"
  AC-AFlow+Skills+Gates:
    source_graph: aflow_imported
    augment_skills: true
    augment_tools: true
    disable_gates: false
    description: "Main dynamic method (imported + skills + tools + gates)"
  AC-Compiled:
    description: "AgentCo-Op compiled from scratch (no AFlow import)"
  AC-ForcedRepair:
    description: "Always run repair regardless of gate signal"
  AC-NoTools:
    disable_python_sandbox: true
    description: "Augmented graph without sandbox / symbolic tools"

budget:
  max_tokens: 30000
  max_cost_usd: 0.80
  max_wall_time_s: 900

optional_swe_bench:
  enabled: false
  dataset: swe_bench_verified_mini
  resources:
    cpus: 16
    memory_gb: 64
    network: none
  notes: "Only enable after code pipelines are stable."

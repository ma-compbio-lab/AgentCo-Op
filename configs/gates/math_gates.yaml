# Gate policies for MATH dynamic refinement (case_study.md §4.6).

gates:
  boxed_answer_missing:
    trigger: boxed_answer_missing
    action: add_formatter
    max_activations: 1
  answer_extraction_fail:
    trigger: answer_extraction_fail
    action: add_formatter
    max_activations: 1
  arithmetic_fail:
    trigger: arithmetic_fail
    action: retry_node
    max_activations: 1
  symbolic_check_fail:
    trigger: symbolic_check_fail
    action: retry_node
    max_activations: 1
  solver_disagreement:
    trigger: solver_disagreement
    action: add_specialist
    max_activations: 1
  domain_mismatch:
    trigger: domain_mismatch
    action: replace_backend
    max_activations: 1
  budget_near_limit:
    trigger: budget_near_limit
    threshold: 0.9
    action: terminate_with_uncertainty
    max_activations: 1
    scope: graph

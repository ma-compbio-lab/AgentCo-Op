# Gate policies for HumanEval / MBPP dynamic refinement (docs/experiments/case_study.md §4.5).
# Hidden tests are NEVER used as gate signals — only syntax errors,
# runtime errors, generated tests, and public examples may trigger repair.

gates:
  syntax_error:
    trigger: syntax_error
    action: retry_node
    max_activations: 1
  runtime_error:
    trigger: runtime_error
    action: retry_node
    max_activations: 2
  public_or_generated_test_failure:
    trigger: public_or_generated_test_failure
    action: retry_node
    max_activations: 2
  timeout:
    trigger: timeout
    action: add_specialist
    max_activations: 1
  format_invalid:
    trigger: format_invalid
    action: add_formatter
    max_activations: 1
  budget_near_limit:
    trigger: budget_near_limit
    threshold: 0.9
    action: terminate_with_uncertainty
    max_activations: 1
    scope: graph

rules:
  use_hidden_tests_during_generation: false
  allow_generated_tests: true
  generated_test_count_range: [3, 8]
  max_repair_rounds: 3

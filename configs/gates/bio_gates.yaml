# Gate policies for Case Study 1 bulk RNA-seq → gene-set workflow.

gates:
  design_ambiguous:
    trigger: design_ambiguous
    action: retry_node
    max_activations: 1
  too_few_markers:
    trigger: too_few_markers
    threshold: 5
    action: retry_node
    max_activations: 1
  gene_mapping_low:
    trigger: gene_mapping_low
    threshold: 0.7
    action: replace_backend
    max_activations: 1
  enrichment_empty:
    trigger: enrichment_empty
    action: add_specialist
    max_activations: 1
  geneagent_unsupported_claim:
    trigger: geneagent_unsupported_claim
    action: retry_node
    max_activations: 1
  method_disagreement:
    trigger: method_disagreement
    action: add_reviewer
    max_activations: 1
  budget_near_limit:
    trigger: budget_near_limit
    threshold: 0.9
    action: terminate_with_uncertainty
    max_activations: 1
    scope: graph

safety:
  sandbox_network_default: false
  require_approval_for:
    - network_enable
    - write_outside_workspace
    - unknown_shell_command
    - package_install_from_url
    - external_upload
  denied_commands:
    - rm -rf /
    - ":(){ :|:& };:"
  sandbox_defaults:
    network: none
    read_only_inputs: true
    non_root: true
    cpus: 4
    memory_gb: 16
    pids_limit: 512
    timeout_s: 3600

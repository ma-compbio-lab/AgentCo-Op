[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentcoop"
version = "0.2.0"
description = "AgentCo-Op: an evidence-driven compiler for heterogeneous agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentCo-Op authors" }]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "networkx>=3",
  "pyyaml>=6",
  "jsonschema>=4",
  "httpx>=0.27",
  "python-dotenv>=1",
]

[project.optional-dependencies]
bench = [
  "datasets>=2.20",
  "numpy>=1.26",
  "pandas>=2.2",
]
repo = [
  "docker>=7",
  "gitpython>=3",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
]

[project.scripts]
agentcoop = "agentcoop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentcoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning:pytest_asyncio.*",
]

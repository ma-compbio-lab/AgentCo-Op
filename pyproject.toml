[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaforge"
version = "0.1.0"
description = "Dynamic-by-construction workflow compiler/runtime for open-world agentic research automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
]

[project.scripts]
dynaforge-run = "dynaforge.cli:main"
dynaforge-exp = "dynaforge.experiment_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]
analysis = [
  "matplotlib>=3.8,<4",
]
benchmarks = [
  "datasets>=3,<4",
]
mcp = [
  "mcp[cli]>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynaforge = ["conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

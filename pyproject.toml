[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcoop"
version = "0.1.0"
description = "Skill-driven workflow compiler/runtime for specialized agent collaboration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
agentcoop-run = "agentcoop.cli:main"
agentcoop-exp = "agentcoop.experiment_cli:main"
agentcoop-bootstrap-skills = "agentcoop.bootstrap_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]
analysis = [
  "matplotlib>=3.8,<4",
]
benchmarks = [
  "datasets>=3,<4",
  "sympy>=1.13,<2",
]
mcp = [
  "mcp[cli]>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcoop = ["conf/**/*.yaml", "skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

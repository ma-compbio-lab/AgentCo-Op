# @package _global_
# DROP benchmark (reading comprehension, AFlow-aligned split)

defaults:
  - override /model: openai_gpt4o_mini

benchmark:
  kind: drop
  dataset_id: drop
  data_source: aflow_package
  source_split: test
  split_seed: 42
  validation_fraction: 0.2
  smoke_count: 20
  processed_dir: benchmarks/drop/processed
  aflow_cache_dir: benchmarks/aflow_public
  metric: f1
  preferred_answer_nodes:
    - selector
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: direct_answer
  task_profile:
    domain: generic
    answer_mode: exact_answer
    complexity: high
    requires_tool_execution: false
    requires_artifact_validation: false
    preferred_review_style: none
    review_threshold: 0.0
  runtime_expansion:
    enabled: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
  pattern_overrides:
    direct_answer:
      solver_system_prompt: |
        You are answering a reading comprehension question. The passage is
        provided in the task description. Read it carefully and extract
        the exact answer from the text.
        For numerical questions, compute the answer precisely.
        For span-based questions, extract the exact text span.
        Return JSON with:
        - output.final_answer: the concise answer
        - output.reasoning: brief explanation
        - confidence: 0..1
        - summary: short string

blueprint:
  task:
    task_id: drop
    title: DROP
    description: Answer reading comprehension questions requiring discrete reasoning.
  budget:
    max_total_usd: 4.0
    max_total_tokens: 24000
  meta:
    benchmark: drop

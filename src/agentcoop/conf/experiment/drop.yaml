# @package _global_
# DROP benchmark (reading comprehension, AFlow-aligned split)

defaults:
  - override /model: openai_gpt4o_mini

benchmark:
  kind: drop
  dataset_id: drop
  data_source: aflow_package
  source_split: test
  split_seed: 42
  validation_fraction: 0.2
  smoke_count: 20
  processed_dir: benchmarks/drop/processed
  aflow_cache_dir: benchmarks/aflow_public
  metric: f1
  preferred_answer_nodes:
    - selector
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_library
  preferred_pattern: direct_answer
  synthesis:
    enabled: false
  task_profile:
    domain: generic
    answer_mode: exact_answer
    complexity: high
    requires_tool_execution: false
    requires_artifact_validation: false
    preferred_review_style: none
    review_threshold: 0.0
  runtime_expansion:
    enabled: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
  pattern_overrides:
    direct_answer:
      solver_system_prompt: |
        You are answering a DROP reading comprehension question requiring
        discrete reasoning (counting, arithmetic, date calculations, etc.).

        CRITICAL ANSWER FORMAT RULES:
        1. Determine the answer TYPE first:
           - Number: output just the number (e.g., "83", not "83 years" or "83%")
           - Date: output "MM/DD/YYYY" or "YYYY" format
           - Span: output the exact text span from the passage (no extra words)
        2. For ARITHMETIC questions (add/subtract/count), compute carefully:
           - Identify all relevant numbers in the passage
           - State the arithmetic operation explicitly in reasoning
           - Double-check by stating the final answer back
        3. For COUNTING questions, enumerate the items you're counting.
        4. NEVER include units like "%", "years", "dollars" in final_answer
           unless the gold answer style requires them (rare).
        5. NEVER wrap the answer in a sentence — output just the value.

        Process:
        1. Re-read the question to identify what's being asked
        2. Find ALL relevant numbers/dates/entities in the passage
        3. Perform the reasoning step by step
        4. Output ONLY the final value

        Return JSON with:
        - output.final_answer: just the answer value (number, date, or span)
        - output.answer_type: "number", "date", or "span"
        - output.reasoning: step-by-step derivation
        - confidence: 0..1
        - summary: short string

blueprint:
  task:
    task_id: drop
    title: DROP
    description: Answer reading comprehension questions requiring discrete reasoning.
  budget:
    max_total_usd: 4.0
    max_total_tokens: 24000
  meta:
    benchmark: drop

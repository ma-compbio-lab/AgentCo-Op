# @package _global_

blueprint:
  task:
    task_id: minimal-tool-discovery
    title: Minimal Tool Discovery Demo
    description: A minimal blueprint where the planner can discover tools from the registry, including builtin web search.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 12000
  base_nodes:
    - node_id: planner
      kind: agent
      role: Planner
      description: Use discovered tools when current external evidence is needed.
      model: ${model}
      tool_discovery:
        mode: registry
        include_web_search: true
        server_allowlist:
          - builtin-web-search
        max_candidate_tools: 4
      cacheable: true
    - node_id: worker
      kind: agent
      role: Worker
      model: ${model}
      io:
        output_schema:
          type: object
          required:
            - result
  base_edges:
    - edge_id: e1
      src: planner
      dst: worker
  meta:
    demo: true
    tool_discovery_demo: true

# @package _global_

defaults:
  - override /model: openai_gpt5_thinking

benchmark:
  kind: case_study
  runner_mode: compiled_generic
  case_id: generic_repo_transfer_smoke
  title: Generic Repo Transfer Smoke
  case_root: benchmarks/case_studies/generic_repo_transfer_smoke
  repo_root: external/case_studies/generic_repo_transfer_smoke/repos
  methods_excerpt: |
    Validate the generic compiled case-study runner by selecting one candidate repo and executing
    a sandboxed JSON job that writes a report artifact.
  target_figure_description: |
    Produce a structured report artifact that proves the generic repo-transfer path executed end to end.
  candidate_repos:
    - name: local_project
      path: .
  input_assets:
    synthetic_task: generic_repo_transfer_smoke
  expected_outputs:
    - generic_repo_echo_report.json
  output_contract:
    must_include:
      - report_path

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: repo_transfer_validate
  task_profile:
    domain: repo_transfer
    answer_mode: artifact_bundle
    complexity: medium
    requires_repo_search: true
    requires_web_research: false
    requires_artifact_validation: true
    preferred_review_style: gate
  runtime_expansion:
    enabled: true
    max_expansions: 2
  pattern_overrides:
    repo_transfer_validate:
      tool_nodes:
        repo_runner:
          role: RepoRunner
          description: Run a sandboxed generic JSON job for repo-transfer smoke validation.
          sandbox:
            sandbox_id: generic-repo-transfer-smoke
            backend: local_venv
            image: python:3.11
            workdir: .
            safety:
              allow_network: false
              cpu_quota: 1.0
              mem_limit_mb: 2048
              timeout_s: 600
          io:
            output_schema:
              type: object
              required: [selected_repo, summary, report_path]
          meta:
            direct_sandbox_handler: true
            job_module: agentcoop.case_studies.generic_repo_echo_job

blueprint:
  task:
    task_id: generic_repo_transfer_smoke
    title: Generic Repo Transfer Smoke
    description: Validate the generic case-study compile and execution path.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 20000
    max_wall_time_s: 1200
    max_tool_calls: 4
    max_container_starts: 2

executor:
  artifact_root: .agentcoop_artifacts
  allow_offline_fallback: false
  repair_enabled: false

# @package _global_
# HotpotQA benchmark (multi-hop QA, AFlow-aligned split)

defaults:
  - override /model: openai_gpt4o_mini

benchmark:
  kind: hotpotqa
  dataset_id: hotpotqa
  data_source: aflow_package
  source_split: test
  split_seed: 42
  validation_fraction: 0.2
  smoke_count: 20
  processed_dir: benchmarks/hotpotqa/processed
  aflow_cache_dir: benchmarks/aflow_public
  metric: f1
  preferred_answer_nodes:
    - selector
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_library
  preferred_pattern: direct_answer
  synthesis:
    enabled: false
  task_profile:
    domain: generic
    answer_mode: exact_answer
    complexity: high
    requires_tool_execution: false
    requires_artifact_validation: false
    preferred_review_style: none
    review_threshold: 0.0
  runtime_expansion:
    enabled: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
  pattern_overrides:
    direct_answer:
      solver_system_prompt: |
        You are answering a multi-hop question. The question requires combining
        information from multiple passages to arrive at the answer.

        CRITICAL ANSWER FORMAT RULES:
        1. The final_answer must be AS SHORT AS POSSIBLE — typically a single entity,
           name, date, or short phrase (NOT a full sentence).
        2. If the question asks "What kind of company" — answer "insurance company"
           NOT "It is an insurance company based in..."
        3. DO NOT include articles (a, an, the) unless part of a proper noun title.
        4. DO NOT include quotes or punctuation around the answer.
        5. For person names, return the exact name as it appears in context.
        6. For company/entity names, match the exact wording from the context when possible.

        Process:
        1. Read the context carefully, identify relevant facts
        2. Think step by step through the multi-hop chain
        3. Extract the minimal answer span

        Return JSON with:
        - output.final_answer: the minimal answer (1-5 words typically, no sentence)
        - output.reasoning: brief chain of reasoning (max 3 sentences)
        - confidence: 0..1
        - summary: short string

blueprint:
  task:
    task_id: hotpotqa
    title: HotpotQA
    description: Answer multi-hop questions by combining information from multiple passages.
  budget:
    max_total_usd: 4.0
    max_total_tokens: 24000
  meta:
    benchmark: hotpotqa

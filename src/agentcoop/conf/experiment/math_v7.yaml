# @package _global_
# math_v7: Builds on v5 ScEnsemble with SMARTER selector for Precalculus.
# Evidence-based changes from v5:
#   1. Selector no longer blindly prefers executed answer when candidates disagree.
#      Data shows program execution accuracy is only 17% for Precalculus (vs 60% for
#      Prealgebra/NT). Rule change: when candidates disagree, prefer MAJORITY among
#      all 3 candidates, not just the program. When no majority, prefer reasoning
#      paths for trig/complex/matrix problems, program for algebra/counting.
#   2. 7 Precalculus tasks had solver correct but selector overrode with wrong program
#      answer. This fix recovers those.
# What we keep from v5 (proven best at 47.1%):
#   - Challenger solver (ScEnsemble 3-path)
#   - CoT-first solver prompt
#   - Review loop disabled
#   - Concurrent execution
# What we DO NOT add (proven harmful):
#   - Programmer retry (v6: hurt Precalculus -8pp, Prealgebra -4pp)
#   - Review/reviser loops (always destructive with gpt-4o-mini)

defaults:
  - override /model: openai_gpt4o_mini

benchmark:
  kind: math
  dataset_id: EleutherAI/hendrycks_math
  data_source: aflow_package
  config_names:
    - counting_and_probability
    - number_theory
    - prealgebra
    - precalculus
  selected_types:
    - Counting & Probability
    - Number Theory
    - Prealgebra
    - Precalculus
  source_split: test
  split_seed: 42
  validation_fraction: 0.2
  level_filter: Level 5
  smoke_count: 20
  processed_dir: benchmarks/math/processed
  upstream_dir: benchmarks/math/upstream_full
  train_sample_count: 1000
  train_sample_seed: 42
  aflow_cache_dir: benchmarks/aflow_public
  metric: solve_rate
  workflow_variant: aflow_v7
  reporting_protocol: aflow_3run_average
  paper_alignment:
    source: AFlow
    base_model: gpt-4o-mini
    split: 20/80 validation-test
    seed: 42
    subset: MATH level-5 four-type slice
    operators:
      - Custom
      - ScEnsemble
      - Programmer
  preferred_answer_nodes:
    - selector
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: reason_execute_select
  task_profile:
    domain: math
    answer_mode: exact_answer
    complexity: high
    requires_tool_execution: true
    requires_artifact_validation: true
    preferred_review_style: none
    review_threshold: 0.0
  runtime_expansion:
    enabled: false
    max_expansions: 0
    expand_on_low_confidence: false
    expand_on_eval_failure: false
    expand_on_tool_failure: false
    expand_on_output_signal: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
    record_graph_candidates: true
  pattern_overrides:
    reason_execute_select:
      enable_challenger_solver: true
      allow_program_backfill: false
      solver_system_prompt: |
        You are a MATH competition solver.
        Think through the problem step by step. Show ALL your work and reasoning.
        IMPORTANT: Work through each step of your solution completely BEFORE stating the final answer.
        Do not skip steps or jump to conclusions.
        Return JSON with:
        - output.reasoning_steps: array of strings, each step of your work
        - output.final_answer: the exact final answer AFTER completing all reasoning
        - output.notes: any assumptions made
        - confidence: 0..1
        - summary: short string
      programmer_system_prompt: |
        You are the MATH programmer node.
        Write a Python function called solve() that computes the answer to the problem.
        If your code fails, you may receive the error message — fix the bug and try again.
        Use Python stdlib, SymPy, and NumPy.
        IMPORTANT: The function must assign the result to a variable called FINAL_ANSWER and print it.
        For counting/combinatorics: enumerate directly when feasible.
        For precalculus/trig: use sympy.simplify, sympy.trigsimp, explicit degree/radian conversion.
        Keep exact symbolic forms (fractions, radicals, pi).
        Return JSON with:
        - output.program: executable Python code
        - output.final_answer: the answer implied by that code
        - output.notes: brief notes
        - confidence: 0..1
        - summary: short string
        Do not omit output.program.
      tool_nodes:
        program_exec:
          tools:
            - server: direct
              tool: math_program_exec
          sandbox:
            sandbox_id: math-program-exec-v5
            backend: local_venv
            image: python:3.11
            workdir: .
            safety:
              allow_network: false
              cpu_quota: 1.0
              mem_limit_mb: 2048
              timeout_s: 60
            bootstrap_cmds:
              - [python, -m, pip, install, sympy]
              - [python, -m, pip, install, numpy]
          io:
            output_schema:
              type: object
              required: [passed, executed_answer]
          meta:
            direct_sandbox_handler: true
      selector_system_prompt: |
        You are the MATH answer selector using self-consistency ensemble.
        You receive multiple candidate answers from different reasoning paths:
        - solver_answer: from direct reasoning (path A)
        - challenger_answer: from independent reasoning (path B, if available)
        - executed_answer: from code execution (path C)

        Your job is to select the BEST answer using these rules in order:

        RULE 1 — MAJORITY WINS: If 2 or more candidates agree on the same answer
        (numerically equivalent counts as agreement), select that answer with
        confidence >= 0.95. This is the strongest signal.

        RULE 2 — REASONING AGREEMENT: If solver_answer and challenger_answer agree
        but executed_answer disagrees, prefer the reasoning consensus. Two independent
        reasoning paths agreeing outweighs one code execution, especially for
        trigonometry, complex numbers, and matrix problems where programs often
        compute incorrectly.

        RULE 3 — CODE + ONE REASONING: If executed_answer agrees with either
        solver_answer or challenger_answer, prefer that agreeing pair.

        RULE 4 — ALL DISAGREE: When all three candidates give different answers:
        - If the problem involves trigonometry, complex numbers, vectors, or matrices:
          prefer the solver_answer (reasoning is more reliable than code for these topics).
        - If the problem involves counting, algebra, or number theory:
          prefer the executed_answer (code is more reliable for computation).
        - If the executed_answer is empty, None, or a bare decimal for an exact-form
          question, always prefer solver_answer.

        NEVER set needs_review=true. The review loop is disabled.

        Return JSON with:
        - output.final_answer: chosen final exact answer only
        - output.arbitration_notes: which candidates you compared and why you chose this one
        - output.needs_review: false
        - confidence: 0..1 (0.95+ when 2+ agree, 0.8 when 2 reasoning agree, 0.6 for all-disagree)
        - summary: short string
      reviewer_system_prompt: ""
      reviser_system_prompt: ""

blueprint:
  task:
    task_id: math
    title: MATH
    description: Solve competition mathematics problems and return the final exact answer.
  budget:
    max_total_usd: 6.0
    max_total_tokens: 36000
  meta:
    benchmark: math
    dataset_id: ${benchmark.dataset_id}
    aflow_alignment: ${benchmark.paper_alignment}

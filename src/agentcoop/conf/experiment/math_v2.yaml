# @package _global_

defaults:
  - override /model: openai_gpt4o_mini

benchmark:
  kind: math
  dataset_id: EleutherAI/hendrycks_math
  data_source: aflow_package
  config_names:
    - counting_and_probability
    - number_theory
    - prealgebra
    - precalculus
  selected_types:
    - Counting & Probability
    - Number Theory
    - Prealgebra
    - Precalculus
  source_split: test
  split_seed: 42
  validation_fraction: 0.2
  level_filter: Level 5
  smoke_count: 20
  processed_dir: benchmarks/math/processed
  upstream_dir: benchmarks/math/upstream_full
  train_sample_count: 1000
  train_sample_seed: 42
  aflow_cache_dir: benchmarks/aflow_public
  metric: solve_rate
  workflow_variant: aflow_v2
  reporting_protocol: aflow_3run_average
  paper_alignment:
    source: AFlow
    base_model: gpt-4o-mini
    split: 20/80 validation-test
    seed: 42
    subset: MATH level-5 four-type slice
    operators:
      - Custom
      - ScEnsemble
      - Programmer
  preferred_answer_nodes:
    - reviser
    - selector
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: reason_execute_select
  task_profile:
    domain: math
    answer_mode: exact_answer
    complexity: high
    requires_tool_execution: true
    requires_artifact_validation: true
    preferred_review_style: gate
    review_threshold: 0.78
  runtime_expansion:
    enabled: true
    max_expansions: 2
    expand_on_low_confidence: true
    expand_on_eval_failure: true
    expand_on_tool_failure: true
    expand_on_output_signal: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
    record_graph_candidates: true
  pattern_overrides:
    reason_execute_select:
      enable_challenger_solver: false
      allow_program_backfill: false
      programmer_system_prompt: |
        You are the MATH programmer node.
        Write compact Python verification code for the task in task.description.
        You must return JSON with:
        - output.program: executable Python code that sets FINAL_ANSWER
        - output.final_answer: the answer implied by that code
        - output.notes: short note about assumptions or symbolic handling
        - confidence: 0..1
        - summary: short string
        Use Python stdlib and SymPy.
        For counting/combinatorics questions, encode the literal constraints directly instead of relying on a loose heuristic.
        Keep exact symbolic forms when possible; do not collapse pi, radicals, or rational expressions into decimal approximations unless the problem explicitly asks for a decimal.
        Do not omit output.program.
      tool_nodes:
        program_exec:
          tools:
            - server: direct
              tool: math_program_exec
          sandbox:
            sandbox_id: math-program-exec-v2
            backend: local_venv
            image: python:3.11
            workdir: .
            safety:
              allow_network: false
              cpu_quota: 1.0
              mem_limit_mb: 2048
              timeout_s: 60
            bootstrap_cmds:
              - [python, -m, pip, install, sympy]
              - [python, -m, pip, install, numpy]
          io:
            output_schema:
              type: object
              required: [passed, executed_answer]
          meta:
            direct_sandbox_handler: true
      selector_system_prompt: |
        You are the MATH selector node.
        Reconcile the direct solver and the executed program path.
        Reject any candidate that contradicts explicit problem constraints.
        If the executed program failed, returned an empty answer, or only produced an approximate decimal for an exact symbolic answer,
        set output.needs_review=true unless the solver answer is directly justified from the statement.
        If program_is_synthetic=true, treat the execution as a formatting sanity check rather than independent mathematical evidence.
        If the solver proposes an exact symbolic form and the program only gives a decimal approximation, do not treat the decimal as stronger evidence by default.
        Prefer exact symbolic forms when they are consistent with the problem statement and the execution trace only supplies an approximation.
        If the solver answer and executed answer disagree, set output.needs_review=true unless one candidate can be ruled out directly from the statement.
        If the executed answer is valid and well formed, treat it as the strongest evidence.
        Return JSON with:
        - output.final_answer: chosen final exact answer only
        - output.arbitration_notes
        - output.needs_review: true or false
        - confidence: 0..1
        - summary: short string
      reviewer_system_prompt: |
        You are the MATH review node.
        Re-solve the problem from scratch using the original task plus solver/program/execution evidence.
        Rules:
        - If the problem asks for exact form, reject a bare decimal unless it can be converted back to a clearly equivalent exact expression.
        - If the problem is a counting or discrete-value question, reject non-integral answers and check the counting constraints literally.
        - If execution and solver disagree, consider that the program may encode the wrong interpretation even when it ran successfully.
        Return JSON with:
        - output.corrected_answer
        - output.review_notes
        - confidence: 0..1
        - summary: short string
      reviser_system_prompt: |
        You are the final MATH revision node.
        Use the reviewer result and the selector notes to emit one final answer.
        Preserve exact symbolic form whenever the task asks for it.
        Return JSON with:
        - output.final_answer
        - output.solution_outline
        - confidence: 0..1
        - summary: short string

blueprint:
  task:
    task_id: math
    title: MATH
    description: Solve competition mathematics problems and return the final exact answer.
  budget:
    max_total_usd: 6.0
    max_total_tokens: 36000
  meta:
    benchmark: math
    dataset_id: ${benchmark.dataset_id}
    aflow_alignment: ${benchmark.paper_alignment}

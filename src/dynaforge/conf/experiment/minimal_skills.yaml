# @package _global_

blueprint:
  task:
    task_id: minimal-skills-demo
    title: Minimal Skills Demo
    description: A minimal blueprint where the planner uses a packaged reusable skill.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 10000
  base_nodes:
    - node_id: planner
      kind: agent
      role: Planner
      model: ${model}
      skills:
        - name: structured-json-discipline
          notes: Keep planner outputs compact and schema-aligned.
      cacheable: true
    - node_id: worker
      kind: agent
      role: Worker
      model: ${model}
      io:
        output_schema:
          type: object
          required:
            - result
  base_edges:
    - edge_id: e1
      src: planner
      dst: worker
  meta:
    demo: true
    skills_demo: true

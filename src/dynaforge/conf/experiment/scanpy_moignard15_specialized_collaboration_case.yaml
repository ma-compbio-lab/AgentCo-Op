# @package _global_

benchmark:
  kind: case_study
  case_id: scanpy_moignard15_specialized_collaboration
  title: Scanpy Moignard15 specialized-agent method transfer
  case_root: benchmarks/case_studies/scanpy_moignard15_collaboration_v2
  repo_root: external/case_studies/scanpy_paul15/repos
  methods_excerpt: |
    Transfer the Paul15-style hematopoiesis trajectory workflow to the public Moignard15 dataset:
    preserve the dataset-native preprocessed qRT-PCR representation, run PCA and a neighborhood graph,
    cluster cells, infer coarse lineage structure with PAGA, compute diffusion-based pseudotime from the dataset-default root cell,
    and produce a paper-style figure package with a trajectory embedding, a PAGA graph, and a dynamic-gene evidence panel linked to pseudotime progression.
  target_figure_description: |
    Use reusable specialized agents to transfer the Paul15 figure-production method to the Moignard15 dataset.
    The final package must include a trajectory plot, a PAGA graph, a dynamic-gene panel, and summary metadata preserving Moignard15 stage information.
    Respect the dataset-native preprocessed qRT-PCR representation rather than assuming raw count normalization.
  analysis_config:
    dataset_id: moignard15
    target_sum: 10000.0
    n_top_genes: 32
    n_neighbors: 10
    n_pcs: 10
    resolution: 0.55
    max_scale_value: 10.0
    seed: 0
    cluster_key: leiden
    root_strategy: dataset_default
    dpi: 150
    paga_threshold: 0.03
    marker_top_n: 3
    dynamic_gene_top_n: 5
    dynamic_gene_panel_top_n: 4
  enable_refinement_subgraph: true
  refinement_threshold: 8.0
  candidate_repos:
    - name: scanpy
      url: https://github.com/scverse/scanpy.git
    - name: scanpy-tutorials
      url: https://github.com/scverse/scanpy-tutorials.git
  paper_spec_sandbox:
    sandbox_id: moignard15-paper-spec-v2
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_TRANSPORT: stdio
      SPECIALIZED_AGENT_ROLE: paper_spec
      SPECIALIZED_AGENT_ALLOW_UNAUTHENTICATED: "true"
    safety:
      allow_network: true
      cpu_quota: 1.0
      mem_limit_mb: 4096
      timeout_s: 900
    bootstrap_cmds:
      - [python, -m, pip, install, mcp]
  planner_sandbox:
    sandbox_id: moignard15-execution-planner-v2
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_TRANSPORT: stdio
      SPECIALIZED_AGENT_ROLE: execution_planner
      SPECIALIZED_AGENT_ALLOW_UNAUTHENTICATED: "true"
    safety:
      allow_network: true
      cpu_quota: 1.0
      mem_limit_mb: 4096
      timeout_s: 900
    bootstrap_cmds:
      - [python, -m, pip, install, mcp]
  trajectory_sandbox:
    sandbox_id: moignard15-trajectory-specialist-v2
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_SERVER_NAME: scanpy-paul15
      MCP_TRANSPORT: stdio
    safety:
      allow_network: true
      cpu_quota: 2.0
      mem_limit_mb: 8192
      timeout_s: 1800
    repo2run:
      source: external/case_studies/scanpy_paul15/repos/scanpy
    bootstrap_cmds:
      - [python, -m, pip, install, leidenalg, igraph, pillow, mcp, openpyxl]
  critic_sandbox:
    sandbox_id: moignard15-figure-critic-v2
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_TRANSPORT: stdio
      SPECIALIZED_AGENT_ROLE: figure_critic
      SPECIALIZED_AGENT_ALLOW_UNAUTHENTICATED: "true"
    safety:
      allow_network: true
      cpu_quota: 1.0
      mem_limit_mb: 4096
      timeout_s: 900
    bootstrap_cmds:
      - [python, -m, pip, install, mcp]

blueprint:
  task:
    task_id: scanpy_moignard15_specialized_collaboration_case
    title: Scanpy Moignard15 specialized-agent method transfer
    description: Compose reusable paper-spec, planning, execution, and figure-critic specialists for Moignard15 transfer.
  budget:
    max_total_usd: 14.0
    max_total_tokens: 50000
    max_wall_time_s: 3600
    max_tool_calls: 8
    max_container_starts: 10

executor:
  artifact_root: .dynaforge_artifacts
  allow_offline_fallback: false
  repair_enabled: false

# @package _global_

benchmark:
  kind: case_study
  case_id: scanpy_krumsiek11_method_transfer
  title: Scanpy Krumsiek11 method transfer
  case_root: benchmarks/case_studies/scanpy_krumsiek11_transfer_v1
  repo_root: external/case_studies/scanpy_paul15/repos
  methods_excerpt: |
    Transfer the Paul15-style hematopoiesis trajectory workflow to the public Krumsiek11 dataset:
    preserve target-dataset cell-type metadata, run PCA and a neighborhood graph, cluster cells,
    infer coarse lineage structure with PAGA, compute diffusion-based pseudotime from a dataset-default root when available,
    and produce a paper-style figure package with a trajectory embedding, a PAGA graph, and a dynamic-gene evidence panel.
  target_figure_description: |
    Apply the Paul15 trajectory-analysis method family to the Krumsiek11 dataset and produce a figure package with
    a trajectory plot, a PAGA graph, and a dynamic-gene panel. Preserve Krumsiek11 cell-type metadata and root-selection provenance in the summary.
  candidate_repos:
    - name: scanpy
      url: https://github.com/scverse/scanpy.git
    - name: scanpy-tutorials
      url: https://github.com/scverse/scanpy-tutorials.git
  planner_mode: llm_first
  analysis_config:
    dataset_id: krumsiek11
    target_sum: 10000.0
    n_top_genes: 50
    n_neighbors: 10
    n_pcs: 10
    resolution: 0.55
    max_scale_value: 10.0
    seed: 0
    cluster_key: leiden
    root_strategy: dataset_default
    dpi: 150
    paga_threshold: 0.03
    marker_top_n: 3
    dynamic_gene_top_n: 5
    dynamic_gene_panel_top_n: 4
  enable_refinement_subgraph: true
  refinement_threshold: 8.0
  review_model: ${model}
  sandbox:
    sandbox_id: scanpy-krumsiek11-transfer-v1
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_SERVER_NAME: scanpy-paul15
      MCP_TRANSPORT: stdio
    safety:
      allow_network: true
      cpu_quota: 2.0
      mem_limit_mb: 8192
      timeout_s: 1800
    repo2run:
      source: external/case_studies/scanpy_paul15/repos/scanpy
    bootstrap_cmds:
      - [python, -m, pip, install, leidenalg, igraph, pillow, mcp, openpyxl]

blueprint:
  task:
    task_id: scanpy_krumsiek11_transfer_case
    title: Scanpy Krumsiek11 method transfer
    description: Transfer a Paul15-style trajectory workflow to Krumsiek11 using a sandboxed external repo.
  budget:
    max_total_usd: 12.0
    max_total_tokens: 45000
    max_wall_time_s: 3600
    max_tool_calls: 6
    max_container_starts: 4

executor:
  artifact_root: .dynaforge_artifacts
  allow_offline_fallback: false
  repair_enabled: false

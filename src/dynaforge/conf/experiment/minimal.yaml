# @package _global_

blueprint:
  task:
    task_id: minimal-demo
    title: Minimal Demo
    description: A minimal Hydra-configured blueprint showing a base graph plus a gated reviewer subgraph.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 10000
  base_nodes:
    - node_id: planner
      kind: agent
      role: Planner
      model: ${model}
      cacheable: true
    - node_id: worker
      kind: agent
      role: Worker
      model: ${model}
      io:
        output_schema:
          type: object
          required:
            - result
  base_edges:
    - edge_id: e1
      src: planner
      dst: worker
  subgraphs:
    - subgraph_id: sg_review
      purpose: Optional review path
      nodes:
        - node_id: reviewer
          kind: evaluator
          role: Reviewer
          model: ${model}
      edges: []
      entry_nodes:
        - reviewer
      exit_nodes:
        - reviewer
      default_enabled: false
  gates:
    - gate_id: low_conf_review
      trigger:
        any_of:
          - field: report.confidence
            op: <
            value: 0.65
      enable_subgraphs:
        - sg_review
      disable_edges: []
      cooldown_steps: 0
      max_activations: 1
  meta:
    demo: true

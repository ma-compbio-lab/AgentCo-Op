# @package _global_

defaults:
  - override /model: openai_gpt5_nano

benchmark:
  kind: medqa
  dataset_id: bigbio/med_qa
  config_name: med_qa_en_bigbio_qa
  trust_remote_code: true
  split: test
  sample_count: 1
  preview_path: benchmarks/medqa/medqa_preview.json
  info_path: benchmarks/medqa/medqa_dataset_info.json
  processed_dir: benchmarks/medqa/processed_${benchmark.split}
  all_splits_dir: benchmarks/medqa/all_splits
  smoke_count: 20
  full_count: all
  train_sample_count: 1000
  train_sample_seed: 7
  seed: 7
  paper_alignment:
    source: Repository benchmark policy
    base_model: gpt-5-nano
    split: full official test
    note: MedQA is not one of the public AFlow benchmarks. Use a simpler direct-answer workflow and GPT-5-nano as the benchmark base model.
  preferred_answer_nodes:
    - reviser
    - reviewer
    - solver

executor:
  allow_offline_fallback: false

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: direct_answer
  task_profile:
    domain: medical_qa
    answer_mode: choice_label
    complexity: medium
    preferred_review_style: gate
    review_threshold: 0.48
    high_risk_hint_field: question_family
    high_risk_hint_values:
      - next_step_management
      - next_step_diagnosis
      - mechanism
      - intoxication
      - pediatrics
  runtime_expansion:
    enabled: true
    max_expansions: 2
    expand_on_low_confidence: true
    expand_on_eval_failure: true
    expand_on_tool_failure: false
    expand_on_output_signal: false
  monitoring:
    enabled: true
    record_compile_trace: true
    record_runtime_events: true
    record_graph_candidates: true
  pattern_overrides:
    direct_answer:
      solver_system_prompt: |
        You are a high-precision medical multiple-choice solver.
        Solve the question directly from task.description and task.hints.options.
        task.hints.question_family is a lightweight prior, not a binding label.
        Use concise clinical reasoning, compare the best option against the strongest distractor, and do not rely on any external planner node.
        First identify the ask family internally: diagnosis, next_step_management, next_step_diagnosis, mechanism, prognosis, professionalism, pediatrics, intoxication, or other.
        Then apply the matching checklist:
        - next_step_management: prefer stabilization or the immediate clinically indicated action over extra workup
        - next_step_diagnosis: choose the best confirming/explanatory test, not the treatment
        - mechanism: identify the drug/process from the stem, then answer the asked therapeutic mechanism rather than the toxicity clue
        - intoxication: use pupils, respiratory rate, mental status, and exposure clues to separate toxidromes
        - pediatrics/newborn: weight age-specific congenital and developmental differentials explicitly
        For ethics/professionalism questions involving another physician's misconduct or nondisclosure,
        prefer the immediate professional step of confronting or correcting the superior before jumping straight to patient disclosure or formal escalation.
        Set output.requires_review=true only if the stem is genuinely ambiguous, if the top two options remain close after comparison,
        or if the question family is next-step/mechanism and your confidence is not clearly high.
        Return JSON with:
        - output.question_type: one of diagnosis, next_step_management, next_step_diagnosis, mechanism, prognosis, professionalism, pediatrics, intoxication, other
        - output.final_answer_label: one uppercase option label
        - output.final_answer_text: exact chosen option text
        - output.rationale: concise reasoning
        - output.why_not_runner_up: one sentence on the strongest distractor
        - output.requires_review: true only if the stem is genuinely ambiguous
        - output.uncertainty_reason: short string
        - confidence: 0..1
        - summary: short string
        Choose exactly one available option.
      reviewer_system_prompt: |
        You are a skeptical medical reviewer.
        Audit the solver answer against the original question and options.
        Use solver.question_type only as a weak prior; independently verify the ask from the stem.
        For ethics/professionalism questions involving nondisclosure, explicitly distinguish:
        immediate correction of the superior,
        direct patient disclosure,
        and punitive escalation.
        If the solver is already well supported by the stem, prefer keep over cosmetic revisions.
        Return JSON with:
        - output.review_verdict: "keep" or "revise"
        - output.corrected_answer_label
        - output.corrected_answer_text
        - output.critique
        - output.rationale
        - confidence: 0..1
        - summary: short string
        If you keep the solver answer, copy that same answer into corrected_answer_label and corrected_answer_text instead of leaving them blank.
      reviser_system_prompt: |
        You are the MedQA final revision node.
        Use the original question plus solver and reviewer outputs.
        Return JSON with:
        - output.final_answer_label
        - output.final_answer_text
        - output.rationale
        - confidence: 0..1
        - summary: short string

blueprint:
  task:
    task_id: medqa
    title: MedQA
    description: Answer medical multiple-choice questions from the MedQA benchmark.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 18000
  meta:
    benchmark: medqa
    dataset_id: ${benchmark.dataset_id}
    config_name: ${benchmark.config_name}
    split: ${benchmark.split}

# @package _global_

benchmark:
  kind: case_study
  case_id: scanpy_pbmc3k_umap
  title: Scanpy PBMC3k UMAP reproduction
  case_root: benchmarks/case_studies/scanpy_pbmc3k
  repo_root: external/case_studies/scanpy_pbmc3k/repos
  methods_excerpt: |
    Filter PBMC3k cells with fewer than 200 genes and genes seen in fewer than 3 cells.
    Normalize counts per cell to a target sum of 10,000, apply log1p, keep the top 2,000 highly variable genes,
    scale values with max_value=10, run PCA, build a 10-nearest-neighbor graph using up to 40 PCs,
    compute UMAP, cluster with Leiden resolution 0.5, and plot a UMAP colored by the Leiden labels.
  target_figure_description: |
    Produce a PNG UMAP embedding of PBMC3k cells colored by Leiden clusters.
    The figure should have multiple visually distinct clusters and preserve a standard single-cell Scanpy style.
  candidate_repos:
    - name: scanpy
      url: https://github.com/scverse/scanpy.git
    - name: scanpy-tutorials
      url: https://github.com/scverse/scanpy-tutorials.git
  analysis_config:
    min_genes: 200
    min_cells: 3
    target_sum: 10000.0
    n_top_genes: 2000
    n_neighbors: 10
    n_pcs: 40
    resolution: 0.5
    max_scale_value: 10.0
    seed: 0
    color_by: leiden
    dpi: 150
  enable_refinement_subgraph: true
  refinement_threshold: 8.0
  review_model: ${model}
  sandbox:
    sandbox_id: scanpy-pbmc3k
    backend: local_venv
    image: python:3.11
    workdir: .
    env:
      MCP_SERVER_NAME: scanpy-pbmc3k
      MCP_TRANSPORT: stdio
    safety:
      allow_network: true
      cpu_quota: 2.0
      mem_limit_mb: 8192
      timeout_s: 1800
    repo2run:
      source: external/case_studies/scanpy_pbmc3k/repos/scanpy
    bootstrap_cmds:
      - [python, -m, pip, install, leidenalg, igraph, pillow, mcp]

blueprint:
  task:
    task_id: scanpy_pbmc3k_case
    title: Scanpy PBMC3k UMAP reproduction
    description: Reproduce a PBMC3k UMAP figure from a methods excerpt using a sandboxed external repo.
  budget:
    max_total_usd: 10.0
    max_total_tokens: 30000
    max_wall_time_s: 3600
    max_tool_calls: 6
    max_container_starts: 4

executor:
  artifact_root: .dynaforge_artifacts
  allow_offline_fallback: false
  repair_enabled: false

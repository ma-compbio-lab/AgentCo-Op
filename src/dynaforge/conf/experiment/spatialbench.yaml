# @package _global_

benchmark:
  kind: spatialbench
  repo_url: https://github.com/latchbio/spatialbench
  repo_path: external/spatialbench
  venv_path: external/spatialbench/.venv
  validation_eval: evals_canonical/qc/xenium_xenium_qc_filter_min_umi_counts.json
  validation_output_path: benchmarks/spatialbench/validation_summary.json

blueprint:
  task:
    task_id: spatialbench
    title: SpatialBench
    description: Validate and prepare the SpatialBench benchmark environment and canonical evals.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 12000
  base_nodes:
    - node_id: planner
      kind: agent
      role: Planner
      model: ${model}
      cacheable: true
    - node_id: analyst
      kind: agent
      role: Analyst
      model: ${model}
      io:
        output_schema:
          type: object
          required:
            - result
  base_edges:
    - edge_id: spatial_plan
      src: planner
      dst: analyst
  meta:
    benchmark: spatialbench
    repo_path: ${benchmark.repo_path}
    validation_eval: ${benchmark.validation_eval}


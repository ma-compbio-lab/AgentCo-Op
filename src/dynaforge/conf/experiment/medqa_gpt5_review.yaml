# @package _global_

benchmark:
  kind: medqa
  dataset_id: bigbio/med_qa
  config_name: med_qa_en_bigbio_qa
  trust_remote_code: true
  split: test
  sample_count: 1
  preview_path: benchmarks/medqa/medqa_preview.json
  info_path: benchmarks/medqa/medqa_dataset_info.json
  processed_dir: benchmarks/medqa/processed_${benchmark.split}
  smoke_count: 20
  full_count: all
  seed: 7
  preferred_answer_nodes:
    - reviser
    - reviewer
    - responder

review_model:
  provider: openai
  name: gpt-5
  temperature: 0.2
  max_output_tokens: 2048
  usd_per_1k_input: 0.00125
  usd_per_1k_output: 0.01
  meta:
    reasoning_effort: minimal

blueprint:
  task:
    task_id: medqa
    title: MedQA
    description: Answer medical multiple-choice questions from the MedQA benchmark.
  budget:
    max_total_usd: 5.0
    max_total_tokens: 24000
  base_nodes:
    - node_id: planner
      kind: agent
      role: Planner
      model: ${model}
      description: Distill the clinical question, extract key clues, and propose a likely answer candidate.
      system_prompt: |
        You are the MedQA planning node.
        Read task.description and task.hints.options.
        Return JSON with:
        - output.distilled_question: short string
        - output.question_type: one of diagnosis, next_step_management, next_step_diagnosis, imaging, mechanism, prognosis, other
        - output.key_clues: array of short strings
        - output.likely_answer_label: single uppercase option label or empty string
        - output.best_option_family: short phrase describing the winning answer family
        - output.runner_up_family: short phrase describing the strongest competing answer family
        - output.most_discriminating_clue: short string explaining what separates the best option from the runner-up
        - output.rationale_outline: array of short reasoning bullets
        - confidence: 0..1
        - summary: short string
        Use classic exam heuristics when relevant:
        - chronic bronchitis / "blue bloater" = productive cough + cyanosis + peripheral edema/cor pulmonale
          and should favor cardiomegaly / increased bronchovascular or bronchial markings;
        - emphysema / "pink puffer" = hyperinflation + loss of lung markings.
        - pediatric migraine with normal exam and no red flags should favor first-line acute treatment
          (acetaminophen/ibuprofen) over trigger workup, even if the stem mentions recent glasses.
        Do not invent new options and do not output the final answer prose here.
      cacheable: true
    - node_id: responder
      kind: agent
      role: Responder
      model: ${model}
      description: Choose the single best answer option and explain it briefly.
      system_prompt: |
        You are the MedQA answer node.
        Solve the question independently from task.description, task.hints.question, and task.hints.options.
        Planner support is advisory only and is exposed via planner_question_type, planner_key_clues,
        planner_most_discriminating_clue, and planner_rationale_outline.
        Do not anchor on the planner's provisional answer family.
        Explicitly distinguish diagnosis vs next-step management vs next-step diagnosis vs imaging vs mechanism questions.
        For "next step in management" questions, prefer first-line treatment over extra workup unless the stem contains a true red flag.
        If a distractor is a workup step and another option is the straightforward first-line treatment, prefer the treatment.
        For smoking-related COPD imaging questions, use the classic phenotype heuristic:
        chronic bronchitis / "blue bloater" = productive cough + cyanosis + edema/cor pulmonale
        and should favor cardiomegaly plus increased bronchial or bronchovascular markings;
        emphysema / "pink puffer" = hyperinflation and loss of lung markings.
        For pediatric migraine questions with a normal exam and no red flags, do not let recent glasses or visual triggers
        outrank first-line acute therapy such as acetaminophen or ibuprofen unless the stem explicitly asks for further evaluation.
        Return JSON with:
        - output.final_answer_label: single uppercase option label
        - output.final_answer_text: exact option text copied verbatim from the chosen option
        - output.rationale: concise clinical reasoning
        - output.why_not_runner_up: one sentence explaining why the closest competing option is wrong
        - confidence: 0..1
        - summary: short string
        You must choose exactly one available option.
      io:
        output_schema:
          type: object
          required:
            - final_answer_label
            - final_answer_text
            - rationale
  base_edges:
    - edge_id: medqa_plan
      src: planner
      dst: responder
      mapping:
        planner_question_type: question_type
        planner_key_clues: key_clues
        planner_most_discriminating_clue: most_discriminating_clue
        planner_rationale_outline: rationale_outline
  subgraphs:
    - subgraph_id: sg_review
      purpose: Review and revise uncertain answers.
      nodes:
        - node_id: reviewer
          kind: evaluator
          role: Reviewer
          model: ${review_model}
          description: Audit the draft answer against the question and options.
          system_prompt: |
            You are the MedQA reviewer.
            Audit the responder answer using the original question and options.
            Assume the responder may be wrong and actively try to falsify the proposed answer before you keep it.
            Pay special attention to subtype distinctions and to "next step in management" questions where workup is often a distractor.
            For "next step in management" questions, prefer the immediate first-line management step unless the stem contains a red flag.
            For smoking-related COPD imaging questions, use the classic phenotype heuristic:
            chronic bronchitis / "blue bloater" = productive cough + cyanosis + edema/cor pulmonale
            and should favor cardiomegaly plus increased bronchial or bronchovascular markings;
            emphysema / "pink puffer" = hyperinflation and loss of lung markings.
            For pediatric migraine with a normal exam and no red flags, keep first-line acute treatment above trigger workup,
            and do not over-weight recent glasses unless the stem explicitly asks for diagnostic evaluation.
            Return JSON with:
            - output.review_verdict: "keep" or "revise"
            - output.corrected_answer_label: single uppercase option label
            - output.corrected_answer_text: exact option text copied verbatim from the chosen option
            - output.critique: brief critique
            - output.rationale: brief rationale
            - confidence: 0..1
            - summary: short string
        - node_id: reviser
          kind: agent
          role: Reviser
          model: ${review_model}
          description: Produce the final corrected answer after review.
          system_prompt: |
            You are the MedQA final revision node.
            Use the original question, options, responder output, and reviewer output.
            If reviewer output conflicts with the responder, prefer the choice that better matches the stem's exact ask
            (for example: treatment vs workup, subtype distinction, imaging pattern).
            For smoking-related COPD imaging questions, remember:
            chronic bronchitis / "blue bloater" = productive cough + cyanosis + edema/cor pulmonale
            and should favor cardiomegaly plus increased bronchial or bronchovascular markings;
            emphysema / "pink puffer" = hyperinflation and loss of lung markings.
            For pediatric migraine with a normal exam and no red flags, prefer first-line acute treatment over trigger workup
            unless the stem explicitly asks for diagnostic evaluation.
            Return JSON with:
            - output.final_answer_label: single uppercase option label
            - output.final_answer_text: exact option text copied verbatim from the chosen option
            - output.rationale: concise final reasoning
            - output.why_not_runner_up: one sentence explaining why the closest competing option is wrong
            - confidence: 0..1
            - summary: short string
            Choose exactly one available option.
          io:
            output_schema:
              type: object
              required:
                - final_answer_label
                - final_answer_text
                - rationale
      edges:
        - edge_id: medqa_review_from_responder
          src: responder
          dst: reviewer
        - edge_id: medqa_revise
          src: reviewer
          dst: reviser
      entry_nodes:
        - reviewer
      exit_nodes:
        - reviser
      default_enabled: false
  gates:
    - gate_id: medqa_low_conf_review
      trigger:
        all_of:
          - field: node.node_id
            op: ==
            value: responder
          - any_of:
              - field: report.confidence
                op: <
                value: 0.86
              - field: report.failure_type
                op: ==
                value: low_confidence
      enable_subgraphs:
        - sg_review
      disable_edges: []
      cooldown_steps: 0
      max_activations: 1
  meta:
    benchmark: medqa
    dataset_id: ${benchmark.dataset_id}
    config_name: ${benchmark.config_name}
    split: ${benchmark.split}

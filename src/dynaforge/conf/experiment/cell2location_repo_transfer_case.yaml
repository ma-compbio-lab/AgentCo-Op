# @package _global_

defaults:
  - override /model: openai_gpt5_thinking

benchmark:
  kind: case_study
  runner_mode: compiled_generic
  case_id: cell2location_repo_transfer
  title: cell2location Repository Transfer on a Held-out Mouse Brain Slide
  case_root: benchmarks/case_studies/cell2location_repo_transfer
  repo_root: external/case_studies/cell2location_transfer/repos
  methods_excerpt: experiment3-2.md
  target_figure_description: |
    Execute the official cell2location repository on a held-out Visium mouse-brain slide using the official
    precomputed reference signatures, then produce abundance maps, Leiden regions, and a transfer report.
  task_notes: |
    This packaged transfer variant uses the official cell2location mouse-brain short-demo assets but switches to a held-out slide.
    It is intentionally CPU-reduced: precomputed reference signatures are used and downstream NMF is deferred.
  candidate_repos:
    - name: cell2location
      path: external/case_studies/cell2location_transfer/repos/cell2location
    - name: scanpy
      url: https://github.com/scverse/scanpy.git
  input_assets:
    public_data_bundle: cell2location_mouse_brain
    holdout_slide: ST8059050
    training_defaults:
      holdout_slide: ST8059050
      N_cells_per_location: 8.0
      detection_alpha: 20.0
      max_epochs: 60
      num_posterior_samples: 20
      nmf_components: 4
  expected_outputs:
    - sp.h5ad
    - mapping_summary.json
    - transfer_report.md
    - cell_abundance_panel.png
    - leiden_regions.png
    - nmf_compartments.png
    - nmf_compartments_summary.json
    - qc_spatial.png
  output_contract:
    must_include:
      - mapping_summary_path
      - mapped_h5ad_path
      - cell_abundance_panel_path
      - leiden_regions_path
      - nmf_compartments_path
      - nmf_summary_path
      - qc_spatial_path

workflow_design:
  enabled: true
  mode: pattern_then_synthesize
  preferred_pattern: repo_transfer_validate
  task_profile:
    domain: repo_transfer
    answer_mode: artifact_bundle
    complexity: high
    requires_tool_execution: true
    requires_repo_search: true
    requires_web_research: true
    requires_artifact_validation: true
    preferred_review_style: gate
    expected_artifacts:
      - sp.h5ad
      - mapping_summary.json
      - cell_abundance_panel.png
  runtime_expansion:
    enabled: true
    max_expansions: 2
  pattern_overrides:
    repo_transfer_validate:
      repo_scout_system_prompt: |
        You are selecting the repository and transfer configuration for a scientific repo-transfer task.
        Return strict JSON with:
        - output.selected_repo
        - output.repo_candidates
        - output.analysis_config with holdout_slide, N_cells_per_location, detection_alpha, max_epochs, num_posterior_samples, nmf_components
        - output.summary
        Prefer the official method repository when the task explicitly asks for paper/repo transfer.
      refiner_system_prompt: |
        You are repairing a scientific repo-transfer run.
        Return strict JSON with:
        - output.selected_repo
        - output.analysis_config
        - output.summary
        Only adjust repo choice or training/config parameters when validator concerns clearly require it.
      tool_nodes:
        repo_runner:
          role: RepoRunner
          description: Execute a CPU-reduced cell2location transfer on a held-out mouse-brain slide.
          sandbox:
            sandbox_id: cell2location-transfer
            backend: local_venv
            image: python:3.13
            workdir: repo
            safety:
              allow_network: true
              cpu_quota: 2.0
              mem_limit_mb: 16384
              timeout_s: 7200
            repo2run:
              source: external/case_studies/cell2location_transfer/repos/cell2location
              build_cmd: [python, -m, pip, install, -e, ".[tutorials]"]
          io:
            output_schema:
              type: object
              required: [selected_repo, mapping_summary_path, mapped_h5ad_path, nmf_compartments_path, nmf_summary_path, summary]
          meta:
            direct_sandbox_handler: true
            job_module: dynaforge.case_studies.cell2location_transfer_job

blueprint:
  task:
    task_id: cell2location_repo_transfer
    title: cell2location Repository Transfer
    description: Transfer the official cell2location workflow to a held-out Visium mouse-brain slide.
  budget:
    max_total_usd: 20.0
    max_total_tokens: 65000
    max_wall_time_s: 10800
    max_tool_calls: 4
    max_container_starts: 3

executor:
  artifact_root: .dynaforge_artifacts
  allow_offline_fallback: false
  repair_enabled: false

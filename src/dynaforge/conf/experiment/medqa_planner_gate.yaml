# @package _global_

defaults:
  - medqa
  - _self_

blueprint:
  gates:
    - gate_id: medqa_low_conf_review
      trigger:
        any_of:
          - field: report.confidence
            op: <
            value: 0.86
          - field: report.failure_type
            op: ==
            value: low_confidence
      enable_subgraphs:
        - sg_review
      disable_edges: []
      cooldown_steps: 0
      max_activations: 1

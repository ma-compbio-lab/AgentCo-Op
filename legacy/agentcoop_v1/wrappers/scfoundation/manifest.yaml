name: scfoundation
backend_type: sandbox_repo
source:
  repo: https://github.com/biomap-research/scFoundation
  commit: TODO_PIN
build:
  dockerfile: Dockerfile.agentcoop
  context: .
run:
  entrypoint: python /workspace/adapter.py
  args_schema:
    command: str
    params:
      dataset: str
      perturbation: str
      split: str
resources:
  cpus: 8
  memory_gb: 32
  gpu: true
  min_vram_gb: 40
  pids_limit: 1024
  timeout_s: 14400
security:
  network: none
  non_root: true
  mounts: [{input: read_only}, {output: read_write}]
  secrets: []
outputs:
  result_json: /outputs/result.json
  logs: /outputs/logs.txt
notes:
  - "Pin GEARS-compatible fork for downstream perturbation; larger VRAM than scGPT."

name: Signac
kind: sandboxed_external_agent
repository: https://github.com/stuart-lab/signac
container: agentcoop-signac:case-study-2
role: scATAC-seq marker-gene discovery specialist
capabilities:
  - load peak-by-cell ATAC count matrix (MatrixMarket)
  - load peak BED file
  - create ChromatinAssay-equivalent (Python sparse + peak GRanges)
  - attach cell-type metadata via ATAC barcode column
  - run differential accessibility per cell type
  - map marker peaks to nearest gene (mm10)
  - aggregate peak-level evidence into per-gene marker scores
  - export top-N marker genes per cell type
input_schema:
  type: object
  required: [task_description, output_dir]
  properties:
    task_description: {type: string}
    output_dir: {type: string}
    parameters:
      type: object
      properties:
        top_n: {type: integer}
        min_cells_per_type: {type: integer}
        remove_cell_types:
          type: array
          items: {type: string}
        atac_marker_method:
          type: object
          properties:
            test_use: {type: string}
            min_pct: {type: number}
            peak_to_gene: {type: string}
            extend_upstream_bp: {type: integer}
output_schema:
  type: object
  required: [status, summary, artifacts]
  properties:
    status: {enum: [success, failed, partial]}
    summary: {type: string}
    artifacts:
      type: object
      properties:
        atac_peak_markers_all_csv: {type: string}
        peak_to_gene_mapping_csv: {type: string}
        atac_marker_genes_all_csv: {type: string}
        atac_top_marker_genes_json: {type: string}
        run_log: {type: string}
    main_results:
      type: object
      properties:
        n_cells: {type: integer}
        n_peaks: {type: integer}
        n_cell_types: {type: integer}
        top_n: {type: integer}
    warnings:
      type: array
      items: {type: string}

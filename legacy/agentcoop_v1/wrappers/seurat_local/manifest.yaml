name: Seurat
kind: sandboxed_external_agent
repository: https://github.com/satijalab/seurat
container: agentcoop-seurat:case-study-2
role: scRNA-seq marker discovery specialist
capabilities:
  - load gene-by-cell count matrix
  - create Seurat object
  - attach cell-type metadata
  - normalize scRNA-seq counts
  - run FindAllMarkers by cell type
  - export marker tables and top-N gene sets
input_schema:
  type: object
  required: [task_description, output_dir]
  properties:
    task_description: {type: string}
    output_dir: {type: string}
    parameters:
      type: object
      properties:
        top_n: {type: integer}
        min_cells_per_type: {type: integer}
        remove_cell_types:
          type: array
          items: {type: string}
        rna_marker_method:
          type: object
          properties:
            test_use: {type: string}
            min_pct: {type: number}
            logfc_threshold: {type: number}
            only_pos: {type: boolean}
output_schema:
  type: object
  required: [status, summary, artifacts]
  properties:
    status: {enum: [success, failed, partial]}
    summary: {type: string}
    artifacts:
      type: object
      properties:
        rna_markers_all_csv: {type: string}
        rna_top_markers_json: {type: string}
        celltype_distribution_csv: {type: string}
        run_log: {type: string}
    main_results:
      type: object
      properties:
        n_cells: {type: integer}
        n_genes: {type: integer}
        n_cell_types: {type: integer}
        top_n: {type: integer}
    warnings:
      type: array
      items: {type: string}

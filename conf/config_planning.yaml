defaults:
  - _self_

task:
  goal: >-
    Build a Python CLI tool named "log_scout" that scans a directory of JSONL log
    files, normalizes records to a consistent schema, and outputs:
    (1) a summary report JSON (totals, per-level counts, top error messages),
    (2) a per-file report JSON, and
    (3) an anomalies JSON listing malformed lines and missing required fields.
    The tool should include a short README usage section and unit tests.
  constraints:
    - "Use Python 3.10 syntax and standard library only (no external dependencies)."
    - "Process JSONL files in streaming mode; do not load entire files into memory."
    - "CLI must accept: --input-dir, --summary-out, --per-file-out, --anomalies-out."
    - "Skip empty lines and continue on malformed JSON; record them as anomalies."
    - "Normalize records to schema: timestamp (str|None), level (str), message (str), source (str|None)."
    - "Output JSON must be deterministic and sorted by file name."
  success_criteria:
    - "Provide a file tree showing all new/modified files."
    - "Implement log_scout CLI with argparse and clear help text."
    - "Summary report includes total_records, total_anomalies, counts_by_level, top_errors (top 5)."
    - "Per-file report includes file_name, records, anomalies, counts_by_level."
    - "Anomalies report includes file_name, line_number, reason, raw_line."
    - "Include at least 5 unit tests covering normal, empty, malformed, and missing-field cases."
    - "Add a README usage snippet with example commands and output paths."
  budget_tokens: 20000
  allow_web_search_for_spec: on
  spec_max_search_queries: 2
  allow_tool_search: auto
  tool_max_candidates: 5
  tool_max_search_queries: 3
  task_type: coding
  prompt_verbosity: verbose
  input_modalities:
    - text
  output_modalities:
    - text

method: orchestrated

model:
  backend: openai
  name: gpt-5-nano-2025-08-07
  planner: null
  worker: null
  judge: null
  aggregator: null
  api_key: ${oc.env:OPENAI_API_KEY,null}

log_dir: logs

log:
  enabled: true
  level: debug
  use_color: true
  use_icons: true
  preview_chars: 200
  show_prompts: false
  show_outputs: true

repair:
  enabled: true
  max_rounds: 2
  template_mode: auto

memory:
  enabled: false
  db_path: memory/agent_cop.db
  entity_id: default
  top_k: 3
  store_agent_outputs: true
  store_judge_reports: true
  auto_build: true

planning:
  enabled: true
  db_path: memory/planning.db
  findings_db_path: memory/planning_findings.db
  progress_db_path: memory/planning_progress.db
  include_in_prompts: true
  store_to_memory: true
  max_items: 6

tool:
  enabled: false
  use_docker: true
  base_image: python:3.10-slim
  build_allow_net: true
  run_allow_net: false
  default_timeout_s: 300
  default_cpus: null
  default_memory_mb: null
  default_pids: null
  run_dir: logs/tool_runs
  docker_repair_max_rounds: 2
  repo2run_enabled: false
  repo2run_path: third_party/Repo2Run
  repo2run_python: python
  repo2run_llm: null
  repo2run_prefer_existing: true
  repo2run_work_dir: logs/repo2run

exec:
  enabled: false
  workspace_root: .
  require_approval: true
  max_output_chars: 4000

mcp:
  enabled: false
  approval_mode: auto
  cache_tools_list: true
  enforce_tool_filter: false
  servers: {}
  prompts: {}

chat:
  enabled: true
  db_path: data/chat.db
  history_turns: 8
  stream: true

adaptive:
  enabled: true
  router_model: null
  max_turns: 4
  confidence_threshold: 0.6
  fallback_to_heuristic: true
  memory_top_k: 4
  force_mode: auto

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

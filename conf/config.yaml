defaults:
  - _self_

task:
  goal: "Implement a Python function levenshtein_distance(a: str, b: str) -> int that returns the edit distance between two strings."
  constraints: []
    # - "Use Python 3.10 syntax."
    # - "Do not use external libraries."
    # - "Time complexity O(n*m), space complexity O(min(n, m))."
    # - "Handle empty strings correctly."
  success_criteria: []
    # - "Function signature is exactly levenshtein_distance(a: str, b: str) -> int."
    # - "Includes a short explanation of the algorithm."
    # - "Provides at least 3 test examples with expected outputs."
  budget_tokens: 8000
  allow_web_search_for_spec: auto
  spec_max_search_queries: 2
  input_modalities:
    - text
  output_modalities:
    - text

method: orchestrated

model:
  backend: openai
  name: gpt-5-nano-2025-08-07
  planner: null
  worker: null
  judge: null
  aggregator: null
  api_key: ${oc.env:OPENAI_API_KEY,null}

log_dir: logs

log:
  enabled: true
  level: info
  use_color: true
  use_icons: true
  preview_chars: 200
  show_prompts: false
  show_outputs: false

repair:
  enabled: true
  max_rounds: 2
  template_mode: auto

memory:
  enabled: false
  db_path: memory/agent_cop.db
  entity_id: default
  top_k: 3
  store_agent_outputs: true
  store_judge_reports: true
  auto_build: false

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

defaults:
  - _self_

task:
  goal: "Implement a Python function levenshtein_distance(a: str, b: str) -> int that returns the edit distance between two strings."
  constraints: []
    # - "Use Python 3.10 syntax."
    # - "Do not use external libraries."
    # - "Time complexity O(n*m), space complexity O(min(n, m))."
    # - "Handle empty strings correctly."
  success_criteria: []
    # - "Function signature is exactly levenshtein_distance(a: str, b: str) -> int."
    # - "Includes a short explanation of the algorithm."
    # - "Provides at least 3 test examples with expected outputs."
  budget_tokens: 8000
  allow_web_search_for_spec: on
  spec_max_search_queries: 2
  allow_tool_search: auto
  tool_max_candidates: 5
  tool_max_search_queries: 3
  task_type: auto
  prompt_verbosity: normal
  input_modalities:
    - text
  output_modalities:
    - text

method: baseline

model:
  backend: openai
  name: gpt-5-nano-2025-08-07
  planner: null
  worker: null
  judge: null
  aggregator: null
  api_key: ${oc.env:OPENAI_API_KEY,null}

log_dir: logs

log:
  enabled: true
  level: info
  use_color: true
  use_icons: true
  preview_chars: 200
  show_prompts: false
  show_outputs: true

repair:
  enabled: true
  max_rounds: 2
  template_mode: auto

memory:
  enabled: true
  db_path: memory/agent_cop.db
  entity_id: default
  top_k: 3
  store_agent_outputs: true
  store_judge_reports: true
  auto_build: false

planning:
  enabled: false
  db_path: memory/planning.db
  findings_db_path: null
  progress_db_path: null
  include_in_prompts: true
  store_to_memory: true
  max_items: 5

tool:
  enabled: false
  use_docker: true
  base_image: python:3.10-slim
  build_allow_net: true
  run_allow_net: false
  default_timeout_s: 300
  default_cpus: null
  default_memory_mb: null
  default_pids: null
  run_dir: logs/tool_runs
  docker_repair_max_rounds: 2
  repo2run_enabled: false
  repo2run_path: third_party/Repo2Run
  repo2run_python: python
  repo2run_llm: null
  repo2run_prefer_existing: true
  repo2run_work_dir: logs/repo2run

exec:
  enabled: false
  workspace_root: .
  require_approval: true
  max_output_chars: 4000
  # Writes outside workspace_root are blocked; prompts appear for writes within the workspace.

mcp:
  enabled: false
  approval_mode: auto
  cache_tools_list: true
  enforce_tool_filter: false
  servers: {}
  prompts: {}

chat:
  enabled: true
  db_path: data/chat.db
  history_turns: 8
  stream: true

adaptive:
  enabled: true
  router_model: null
  max_turns: 4
  confidence_threshold: 0.6
  fallback_to_heuristic: true
  memory_top_k: 4
  force_mode: auto
  enforce_self_contained_guardrails: true

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

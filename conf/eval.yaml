defaults:
  - _self_

tasks: "data/tasks.jsonl"
method: orchestrated
log_dir: logs
max_samples: null

log:
  enabled: true
  level: info
  use_color: true
  use_icons: true
  preview_chars: 200
  show_prompts: false
  show_outputs: false

repair:
  enabled: true
  max_rounds: 1
  template_mode: auto

model:
  backend: openai
  name: gpt-4o-mini
  planner: null
  worker: null
  judge: null
  aggregator: null
  api_key: ${oc.env:OPENAI_API_KEY,null}

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

defaults:
  - _self_

tasks: "data/tasks.jsonl"
method: orchestrated
log_dir: logs
max_samples: null

log:
  enabled: true
  level: info
  use_color: true
  use_icons: true
  preview_chars: 200
  show_prompts: false
  show_outputs: false

repair:
  enabled: true
  max_rounds: 1
  template_mode: auto

memory:
  enabled: false
  db_path: memory/agent_cop.db
  entity_id: default
  top_k: 3
  store_agent_outputs: true
  store_judge_reports: true
  auto_build: false

tool:
  enabled: false
  use_docker: true
  base_image: python:3.10-slim
  build_allow_net: true
  run_allow_net: false
  default_timeout_s: 300
  default_cpus: null
  default_memory_mb: null
  default_pids: null
  run_dir: logs/tool_runs
  docker_repair_max_rounds: 2
  repo2run_enabled: false
  repo2run_path: third_party/Repo2Run
  repo2run_python: python
  repo2run_llm: null
  repo2run_prefer_existing: true
  repo2run_work_dir: logs/repo2run

exec:
  enabled: false
  workspace_root: .
  require_approval: true
  max_output_chars: 4000

mcp:
  enabled: false
  approval_mode: auto
  cache_tools_list: true
  enforce_tool_filter: false
  servers: {}
  prompts: {}

model:
  backend: openai
  name: gpt-4o-mini
  planner: null
  worker: null
  judge: null
  aggregator: null
  api_key: ${oc.env:OPENAI_API_KEY,null}

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
